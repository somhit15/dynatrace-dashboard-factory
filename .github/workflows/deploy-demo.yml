name: Deploy dashboards to Dynatrace Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "schemas/**"
      - "src/**"
      - "templates/**"
      - ".github/workflows/deploy-demo.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install framework
        run: pip install -e .
      - name: Generate Terraform
        run: |
          dashboard-factory validate --application examples/parcelplus/application.yaml --request examples/parcelplus/requests/payment-journey.yaml
          dashboard-factory generate --application examples/parcelplus/application.yaml --request examples/parcelplus/requests/payment-journey.yaml --output generated/payment-journey.yaml
          dashboard-factory render --spec generated/payment-journey.yaml --output generated/payment-journey.tf
          cp terraform/provider.tf.example generated/provider.tf
      - uses: hashicorp/setup-terraform@v3
      - name: Format generated Terraform
        run: terraform fmt -recursive generated
      - name: Terraform format check
        run: terraform fmt -check -recursive generated
      - name: Terraform validate
        run: |
          terraform -chdir=generated init -backend=false
          terraform -chdir=generated validate
      - name: Verify Dynatrace environment access
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: |
          test -n "$DYNATRACE_ENV_URL" || { echo "DYNATRACE_ENV_URL is not configured in the demo environment"; exit 1; }
          test -n "$DYNATRACE_API_TOKEN" || { echo "DYNATRACE_API_TOKEN is not configured in the demo environment"; exit 1; }
          status=$(curl --silent --show-error --output /tmp/dynatrace-response.txt --write-out "%{http_code}" \
            --header "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            "${DYNATRACE_ENV_URL%/}/api/config/v1/dashboards")
          if [ "$status" != "200" ]; then
            echo "Dynatrace dashboard API preflight failed with HTTP $status"
            sed -n '1,20p' /tmp/dynatrace-response.txt
            exit 1
          fi
          echo "Dynatrace dashboard API is reachable with ReadConfig access"
      - name: Terraform init
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: terraform -chdir=generated init
      - name: Terraform plan
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: terraform -chdir=generated plan -out=tfplan
      - name: Terraform apply
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: terraform -chdir=generated apply -auto-approve tfplan
