name: Deploy dashboards to Dynatrace Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "schemas/**"
      - "src/**"
      - "templates/**"
      - ".github/workflows/deploy-dev.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install framework
        run: pip install -e .
      - name: Generate Terraform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AI_API_KEY }}
        run: |
          dashboard-factory validate --application examples/parcelplus/application.yaml --request examples/parcelplus/requests/payment-journey.yaml
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Generating dashboard specification via Google Gemini AI..."
            dashboard-factory generate --application examples/parcelplus/application.yaml --request examples/parcelplus/requests/payment-journey.yaml --output generated/payment-journey.yaml --ai
          else
            echo "Generating dashboard specification via standard template generator..."
            dashboard-factory generate --application examples/parcelplus/application.yaml --request examples/parcelplus/requests/payment-journey.yaml --output generated/payment-journey.yaml
          fi
          dashboard-factory render --spec generated/payment-journey.yaml --output generated/payment-journey.tf
          cp terraform/provider.tf.example generated/provider.tf
      - uses: hashicorp/setup-terraform@v3
      - name: Format generated Terraform
        run: terraform fmt -recursive generated
      - name: Terraform format check
        run: terraform fmt -check -recursive generated
      - name: Terraform validate
        run: |
          terraform -chdir=generated init -backend=false
          terraform -chdir=generated validate
      - name: Verify Dynatrace environment access
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: |
          test -n "$DYNATRACE_ENV_URL" || { echo "DYNATRACE_ENV_URL is not configured in the dev environment"; exit 1; }
          test -n "$DYNATRACE_API_TOKEN" || { echo "DYNATRACE_API_TOKEN is not configured in the dev environment"; exit 1; }
          echo "Testing Dynatrace API v2 connectivity..."
          status=$(curl --silent --show-error --output /tmp/dynatrace-response.txt --write-out "%{http_code}" \
            --header "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            "${DYNATRACE_ENV_URL%/}/api/v2/entityTypes?pageSize=1")
          if [ "$status" != "200" ]; then
            echo "Dynatrace API v2 preflight failed with HTTP $status"
            echo "Response body:"
            cat /tmp/dynatrace-response.txt
            echo ""
            echo "Check that DYNATRACE_ENV_URL is your base environment URL (e.g. https://mbs54141.live.dynatrace.com)"
            echo "and DYNATRACE_API_TOKEN has at least entities.read permission."
            exit 1
          fi
          echo "✅ Dynatrace API v2 is reachable — environment URL and token are valid"
      - name: Terraform init
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_AUTOMATION_CLIENT_ID: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_ID }}
          DYNATRACE_AUTOMATION_CLIENT_SECRET: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_SECRET }}
        run: terraform -chdir=generated init
      - name: Terraform plan
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_AUTOMATION_CLIENT_ID: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_ID }}
          DYNATRACE_AUTOMATION_CLIENT_SECRET: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_SECRET }}
        run: terraform -chdir=generated plan -out=tfplan
      - name: Terraform apply
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_AUTOMATION_CLIENT_ID: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_ID }}
          DYNATRACE_AUTOMATION_CLIENT_SECRET: ${{ secrets.DYNATRACE_AUTOMATION_CLIENT_SECRET }}
        run: terraform -chdir=generated apply -auto-approve tfplan
      - name: Verify dashboard deployment
        env:
          DYNATRACE_ENV_URL: ${{ secrets.DYNATRACE_ENV_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: |
          echo "Verifying dashboard deployment via Dynatrace Documents API..."
          status=$(curl --silent --show-error --output /tmp/documents.json --write-out "%{http_code}" \
            --header "Authorization: Api-Token $DYNATRACE_API_TOKEN" \
            "${DYNATRACE_ENV_URL%/}/platform/document/v1/documents?type=dashboard&page-size=50")
          if [ "$status" = "200" ]; then
            if grep -qi "parcelplus" /tmp/documents.json; then
              echo "✅ ParcelPlus dashboard is present in Dynatrace (Documents API)"
            else
              echo "⚠️  Dashboard not found by name yet — Terraform apply succeeded so it should appear shortly"
            fi
          else
            echo "Documents API returned HTTP $status — Terraform apply is the authoritative success signal"
            echo "Check Dynatrace UI → Dashboards to confirm the dashboard is visible"
          fi
